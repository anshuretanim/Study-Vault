<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudyVault</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>📚 StudyVault</h1>
    <p>Your personal study resource manager</p>
  </header>

  <main>

    <section class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="Search resources..."
      >

      <select id="subjectFilter">
        <option value="all">All Subjects</option>
        <option value="Web Development">Web Development</option>
        <option value="Programming">Programming</option>
        <option value="DSA">DSA</option>
        <option value="Statistics">Statistics</option>
        <option value="Backend Development">Backend Development</option>
        <option value="Databases">Databases</option>
        <option value="Digital Electronics">Digital Electronics</option>
      </select>

      <select id="statusFilter">
        <option value="all">All Resources</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
      </select>

    </section>


    <section class="stats">

      <div class="stat-card">
        <h3>Total</h3>
        <p id="totalResources">0</p>
      </div>

      <div class="stat-card">
        <h3>Completed</h3>
        <p id="completedResources">0</p>
      </div>

      <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingResources">0</p>
      </div>

    </section>


    <section>

      <div id="resourceContainer" class="resource-container">
        <!-- JavaScript will insert resources here -->
      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
